[workspace]
authors = ["Su Hang <suhang@shanghaitech.edu.cn>"]
channels = ["conda-forge", "robostack-noetic"]
name = "event simulator"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
build = "cd ~/esim_ws && catkin build esim_ros"

[dependencies]
vcstool = "*"
cmake = "3.*"
python = "*"
glfw = "*"
glm = "*"
opencv = "*"
libcaer = "*"
glog = "0.6.*"
wheel = "*"
glew = "*"
catkin_tools = "*"
ros-noetic-ros = "*"
ros-noetic-roslaunch = "*"
ros-noetic-pcl-ros = "*"
ros-noetic-image-transport = "*"
ros-noetic-camera-info-manager = "*"
ros-noetic-cv-bridge = "*"
ros-noetic-eigen-conversions = "*"
ros-noetic-tf-conversions = "*"
yaml-cpp = "*"
ros-noetic-visualization-msgs = "*"
ros-noetic-rviz = "*"

# Linux/X11-only: libxkbcommon has no macOS candidate. Keeping it in a
# linux-64 target table lets the shared environment solve on osx-arm64
# while leaving the WSL/linux-64 setup unchanged.
[target.linux-64.dependencies]
libxkbcommon = "*"
